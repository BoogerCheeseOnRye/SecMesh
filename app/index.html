<style>

    background:linear-gradient(165deg,rgba(12,16,36,.9),rgba(6,8,20,.82));border:1px solid rgba(126,231,255,.3);
    border-radius:18px;padding:14px 16px;backdrop-filter:blur(14px);

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================ constants */
const N = 118;
const PHI = 1.618033988749895;
const GOLD = 2.3999632297286533;
const R0 = 1.95, CLIMB = 13.0, SPINMOD = 0.10, WAVEF = 2.6, WAVEA = 0.6;
const WIDTH = 4.6, FOLD_NX = (N - 1) * 2, FOLD_NY = 7;

const ERA_NAMES = ['\u2014', 'Ancient', 'Alchemy', '1500s', '1600s', '1700s', 'Early 1800s', 'Late 1800s', '1900s', '1950s', 'Modern', '2000s'];

const ELEMENTS = window.ELEMENTS_DATA.filter(Boolean);

/* ============================================================ shared geometry math
   basePosT / standWave / ringPulse are mirrored in GLSL (ribbon shader) — keep in sync */
function baseRadiusT(t){ return R0 * Math.sqrt(t * (N - 1) + 1); }
function basePosT(t){
  const i = t * (N - 1), ang = GOLD * i;
  const r = R0 * Math.sqrt(i + 1);
  const wob = 1.0 + SPINMOD * Math.sin(t * Math.PI * 2 * WAVEF);
  const cyc = t * CLIMB + WAVEA * Math.sin(t * Math.PI * 3.0);
  return new THREE.Vector3(r * Math.cos(ang) * wob, r * Math.sin(ang) * wob, cyc);
}
function standWave(t, tm){
  const p1 = t * GOLD * 5.0;
  const w1 = 0.9, w2 = w1 * PHI, w3 = w2 * PHI;
  const s1 = Math.sin(tm * w1 + p1);
  const s2 = Math.sin(tm * w2 - p1 * 1.5);
  const s3 = Math.sin(tm * w3 + p1 * 0.5);
  return 0.5 * s1 * s2 + 0.35 * s3 * s1;
}
function ringPulse(t, tm){
  const rr = baseRadiusT(t) / baseRadiusT(1);
  const tt = (tm * 0.22) % 1.0;
  const d = (rr - tt);
  return Math.exp(-d * d * 40.0) * (1.0 - tt);
}
const MAXR = baseRadiusT(1);

/* ============================================================ metric engine */
function hexToRgb(h){
  const n = h.replace('#', '');
  return [parseInt(n.slice(0, 2), 16)/255, parseInt(n.slice(2, 4), 16)/255, parseInt(n.slice(4, 6), 16)/255];
}
function makePal(stops){          // stops: [[pos,hex],...]
  const pts = stops.map(s => ({ p: s[0], c: hexToRgb(s[1]), hex: s[1] }));
  return function(v){
    v = Math.max(0, Math.min(1, v));
    if (v <= pts[0].p) return pts[0].c.slice();
    for (let i = 1; i < pts.length; i++){
      const a = pts[i - 1], b = pts[i];
      if (v <= b.p){
        const f = (v - a.p) / (b.p - a.p);
        return [a.c[0] + (b.c[0]-a.c[0])*f, a.c[1] + (b.c[1]-a.c[1])*f, a.c[2] + (b.c[2]-a.c[2])*f];
      }
    }
    return pts[pts.length - 1].c.slice();
  };
}
function cssStops(stops){ return 'linear-gradient(90deg,' + stops.map(s => s[1] + ' ' + (s[0]*100).toFixed(0) + '%)').join(',') + ')'; }

const BLKFAM = makePal([[0, '#7ee7ff'], [1, '#7ee7ff']]);
const CATSTOPS = [
  [0, '#7ee7ff'],   // s
  [1, '#ff7ab0'],   // p
  [2, '#ffd166'],   // d
  [3, '#66e8b8'],   // f
];

const METRICS = [
  { id:'block', name:'block', sub:'subshell signature', categorical:true,
    val: e => ({ s:0, p:1, d:2, f:3 }[e.blk] || 0) },
  { id:'mass', name:'mass', sub:'atomic mass (log)', unit:'u',
    val: e => Math.log10(e.m), dom:[0, Math.log10(300)], pal:[[0,'#140a2e'],[0.35,'#4c1d6e'],[0.62,'#0e6b86'],[0.85,'#43c7c7'],[1,'#f0fff4']] },
  { id:'en', name:'electronegativity', sub:'Pauling scale', unit:'',
    val: e => e.en, dom:[0.7, 4.0], pal:[[0,'#1c0705'],[0.22,'#5e1209'],[0.5,'#c84312'],[0.78,'#ffa33d'],[1,'#fff3c4']] },
  { id:'density', name:'density', sub:'log g/cm\u00b3', unit:' g/cm\u00b3',
    val: e => Math.log10(Math.max(e.d || 0.001, 0.001)), dom:[Math.log10(0.0001), Math.log10(22.6)],
    pal:[[0,'#240b3f'],[0.3,'#7c2dff'],[0.55,'#00b3c7'],[0.75,'#a3e635'],[0.9,'#ffd166'],[1,'#ff5d8f']] },
  { id:'melt', name:'melting point', sub:'log kelvin', unit:' K',
    val: e => Math.log10(Math.max(e.melt || 1, 1)), dom:[Math.log10(14), Math.log10(3820)],
    pal:[[0,'#10203f'],[0.4,'#3e7fb4'],[0.65,'#bfe9ff'],[0.85,'#ffd166'],[0.95,'#ff6a00'],[1,'#fff7e0']] },
  { id:'boil', name:'boiling point', sub:'log kelvin', unit:' K',
    val: e => Math.log10(Math.max(e.boil || 1, 1)), dom:[Math.log10(4), Math.log10(5930)],
    pal:[[0,'#0a1240'],[0.45,'#3fa8c8'],[0.7,'#7cf5d4'],[0.88,'#ffcf6b'],[1,'#ff9dcd']] },
  { id:'ion', name:'ionization', sub:'first ionization (eV)', unit:' eV',
    val: e => e.ion, dom:[3.9, 24.6], pal:[[0,'#04260f'],[0.42,'#16a34a'],[0.66,'#22d3ee'],[0.85,'#6366f1'],[1,'#e879f9']] },
  { id:'era', name:'discovery era', sub:'when humanity met the element',
    val: e => e.era, dom:[1, 10], pal:[[0,'#3a2416'],[0.2,'#9c6b1f'],[0.45,'#c8843f'],[0.65,'#4e8f7f'],[0.85,'#3f7d8f'],[1,'#d9f2ff']] },
  { id:'crust', name:'crust abundance', sub:'log ppm by mass', unit:' ppm',
    val: e => e.crust, dom:[-9, 5.7], pal:[[0,'#14160a'],[0.35,'#35421c'],[0.6,'#7f9b3a'],[0.8,'#c9b25a'],[0.93,'#f2e6bd'],[1,'#ffffff']] },
  { id:'cosmic', name:'cosmic abundance', sub:'log atoms per 10\u00b2 H',
    val: e => e.cosmic, dom:[-4, 12], pal:[[0,'#0c0620'],[0.3,'#34105c'],[0.55,'#7a1f98'],[0.78,'#e0448c'],[0.92,'#ffb45f'],[1,'#ffecc9']] },
];
let METRIC = METRICS[0];

function valAt(metric, e){
  if (metric.categorical){ return metric.val(e); }
  let raw = metric.val(e);
  if (raw == null || !Number.isFinite(raw)) raw = (metric.dom[0] + metric.dom[1]) / 2;
  let v = (raw - metric.dom[0]) / (metric.dom[1] - metric.dom[0]);
  return Math.max(0, Math.min(1, v));
}
function colorAt(metric, e){
  if (metric.categorical){ const c = CATSTOPS[valAt(metric, e)]; return hexToRgb(c[1]); }
  const pal = makePal(metric.pal);
  return pal(valAt(metric, e));
}

/* precompute raw value per element per metric (cheap) */
const METRIC_RAW = METRICS.map(m => ELEMENTS.map(e => valAt(m, e)));

function applyMetric(i){
  METRIC = METRICS[i % METRICS.length];
  const cats = METRIC.categorical;

  const colors = new Float32Array(N * 3);
  for (let k = 0; k < N; k++){
    const c = colorAt(METRIC, ELEMENTS[k]);
    colors[k*3] = c[0]; colors[k*3+1] = c[1]; colors[k*3+2] = c[2];
  }
  gems.geometry.setAttribute('aColor', new THREE.InstancedBufferAttribute(colors, 3));

  const { t, iformat } = texFmt();
  for (let k = 0; k < N; k++){ const c = colorAt(METRIC, ELEMENTS[k]); t[k*4] = Math.round(c[0]*255); t[k*4+1] = Math.round(c[1]*255); t[k*4+2] = Math.round(c[2]*255); t[k*4+3] = 255; }
  valTex.image.data = t; valTex.needsUpdate = true; valTex.format = iformat;

  if (haloGeo){ haloGeo.getAttribute('aColor').array.set(colors); haloGeo.getAttribute('aColor').needsUpdate = true; }

  legendName.textContent = METRIC.name;
  legendSub.textContent = METRIC.sub;
  const ticksEl = document.getElementById('ticks'); ticksEl.innerHTML = '';
  if (cats){
    gradEl.style.background = 'none';
    catEl.style.display = 'flex';
    ['s', 'p', 'd', 'f'].forEach((bl, bi) => {
      const d = document.createElement('div'); d.className = 'catDot';
      d.innerHTML = '<i style="background:' + CATSTOPS[bi][1] + ';color:' + CATSTOPS[bi][1] + '"></i>' + bl;
      catEl.appendChild(d);
    });
  } else {
    gradEl.style.background = cssStops(METRIC.pal);
    catEl.style.display = 'none';
    catEl.innerHTML = '';
  }
  if (!cats){
    const lo = fmtMetric(METRIC, METRIC.dom[0]), hi = fmtMetric(METRIC, METRIC.dom[1]);
    ticksEl.innerHTML = '<span>' + lo + '</span><span>' + hi + '</span>';
  }
}
let texFmt = () => ({ t: new Uint8Array(N * 4), iformat: THREE.RGBAFormat });
function fmtMetric(m, v){
  if (m.categorical) return '';
  if (m.id === 'density') return (Math.pow(10, v)).toFixed(2);
  if (m.id === 'mass') return Math.round(Math.pow(10, v)) + '';
  if (m.id === 'melt' || m.id === 'boil') return Math.round(Math.pow(10, v)) + ' K';
  if (m.id === 'crust') return v.toFixed(1) + ' log';
  if (m.id === 'cosmic') return v.toFixed(1) + ' log';
  if (m.id === 'era') return v.toFixed(0) + '';
  return v.toFixed(2);
}

/* ============================================================ renderer */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x04050c, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 900);
const world = new THREE.Group();
scene.add(world);

/* ============================================================ stage */
function makeDome(){
  const geo = new THREE.SphereGeometry(420, 48, 32);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, depthTest: false,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec3 vDir;
      float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }
      float vnoise(vec3 p){
        vec3 i = floor(p); vec3 f = fract(p);
        f = f*f*(3.0-2.0*f);
        float n = mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                          mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                      mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                          mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
        return n*2.0-1.0;
      }
      float fbm(vec3 p){
        float f = 0.0, a = 0.5;
        for(int i=0;i<4;i++){ f += a*vnoise(p); p = p*2.1 + vec3(1.7,3.2,0.4); a *= 0.5; }
        return f;
      }
      void main(){
        vec3 d = normalize(vDir);
        float t = uTime*0.018;
        vec3 q = d*3.0 + vec3(t, t*0.6, 0.0);
        float n = fbm(q);
        float n2 = fbm(q*2.8 + 5.0);
        float n3 = fbm(d*5.0 + 9.0 + vec3(0.0,t*0.4,0.0));
        vec3 col = vec3(0.018, 0.024, 0.07);
        col += vec3(0.09, 0.06, 0.24) * smoothstep(0.2, 0.8, n3*0.5+0.5);
        col += vec3(0.24, 0.09, 0.34) * smoothstep(0.4, 0.9, n*0.5+0.5);
        col += vec3(0.09, 0.20, 0.36) * smoothstep(0.5, 0.95, n2*0.5+0.5);
        float star = step(0.9985, hash(d*173.0 + floor(t*7.0)));
        col += vec3(0.8, 0.9, 1.0) * star * (0.4 + 0.6*abs(n3));
        // galactic core glow toward origin
        float ga = dot(normalize(d), normalize(vec3(-0.2,0.1,1.0)));
        col += vec3(0.16, 0.12, 0.32) * pow(max(ga,0.0), 4.0);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mat, mesh };
}
const dome = makeDome();

function makeStars(){
  const n = 1400, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), sz = new Float32Array(n);

      float r = texture2D(tDiffuse, uv - off).r;
      float g = texture2D(tDiffuse, uv).g;
      float b = texture2D(tDiffuse, uv + off * 0.9).b;
      vec3 col = vec3(r, g, b);
      col *= 1.0 - 0.32 * smoothstep(0.2, 0.85, rad * 2.2);
      col = pow(max(col, 0.0), vec3(1.0 / 1.05));
      col = col * vec3(1.02, 1.0, 1.04) + vec3(0.004, 0.006, 0.02);
      col += (hash(uv * 640.0 + vec2(0.0, uTime * 24.0)) - 0.5) * 0.012;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
composer.addPass(gradePass);
composer.addPass(new OutputPass());

/* glow = the shader's own key/ambient glow, with a brightness floor so the
   table is never pitch dark. Defaults fully ON. */
function applyGlow(v){
  const gemMat = nodes[0].mesh.material;
  if (gemMat && gemMat.uniforms && gemMat.uniforms.uGlow) gemMat.uniforms.uGlow.value = v;
  if (sheetMat && sheetMat.uniforms && sheetMat.uniforms.uGlow) sheetMat.uniforms.uGlow.value = v;
}
applyGlow(1);

/* ============================================================ camera rig */
const cam = { az: -0.65, el: 1.12, dist: 42, target: new THREE.Vector3(0, 0, 3) };
const camCur = { az: -0.65, el: 1.12, dist: 42, target: new THREE.Vector3(0, 0, 3) };
let autoSpin = true, spinEnabled = true, idle = 0;
let vel = { az: 0, el: 0 };
let interact = false;

function updateCamera(){
  const k = 1 - Math.pow(0.001, 1 / 60);
  camCur.az += (cam.az - camCur.az) * k;
  camCur.el += (cam.el - camCur.el) * k;
  camCur.dist += (cam.dist - camCur.dist) * k;
  camCur.target.lerp(cam.target, k);
  camCur.el = Math.max(0.08, Math.min(Math.PI / 2 - 0.03, camCur.el));
  const ce = Math.cos(camCur.el), se = Math.sin(camCur.el);
  const ca = Math.cos(camCur.az), sa = Math.sin(camCur.az);
  camera.position.set(
    camCur.target.x + camCur.dist * ce * ca,
    camCur.target.y + camCur.dist * ce * sa,
    camCur.target.z + camCur.dist * se
  );
  camera.lookAt(camCur.target);
}

/* touch/mouse controls */
const ptr = new Map();
let pinch0 = 0, pinchDist = 0, tapPt = null, tapT = 0, moved = false;
let lastMid = null;
const vPan = new THREE.Vector3(), vRight = new THREE.Vector3(), vUpW = new THREE.Vector3();

function camVectors(){
  vRight.setFromMatrixColumn(camera.matrix, 0);
  vUpW.setFromMatrixColumn(camera.matrix, 1);
}
function onDown(x, y, id){
  ptr.set(id, { x, y });
  if (ptr.size === 1){
    tapPt = [x, y]; tapT = performance.now(); moved = false;
    vel.az = vel.el = 0; idle = 0;
  } else if (ptr.size === 2){
    const a = [...ptr.values()];
    pinchDist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    lastMid = [(a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2];
  }
  interact = true;
}
function onMove(x, y, id){
  const p = ptr.get(id); if (!p) return;
  const dx = x - p.x, dy = y - p.y;
  p.x = x; p.y = y;
  if (Math.hypot(x - (tapPt ? tapPt[0] : x), y - (tapPt ? tapPt[1] : y)) > 7) moved = true;
  if (ptr.size === 1){
    cam.az -= dx * 0.0065;
    cam.el = Math.max(0.06, Math.min(Math.PI / 2 - 0.02, cam.el + dy * 0.0065));
    vel.az = -dx * 0.0065;
    vel.el = dy * 0.0065;
    vel.el = Math.max(-0.02, Math.min(0.02, vel.el));
  } else if (ptr.size === 2){
    const a = [...ptr.values()];
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if (pinchDist > 0) cam.dist = Math.max(6, Math.min(120, cam.dist * (pinchDist / d)));
    pinchDist = d;
    const mid = [(a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2];
    if (lastMid){
      camVectors();
      const s = camCur.dist * 0.0011;
      cam.target.addScaledVector(vRight, -(mid[0] - lastMid[0]) * s);
      cam.target.addScaledVector(vUpW, (mid[1] - lastMid[1]) * s);
    }
    lastMid = mid;
    moved = true;
  }
  idle = 0;
}
function onUp(x, y, id){
  if (ptr.has(id)) ptr.delete(id);
  if (ptr.size <= 1) pinchDist = 0;
  if (ptr.size <= 1) lastMid = null;
  if (ptr.size === 0){
    interact = false;
    const dt = performance.now() - tapT;
    if (!moved && dt < 320){ onTap(x, y); }
  }
}
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); e.preventDefault(); onDown(e.clientX, e.clientY, e.pointerId); });
el.addEventListener('pointermove', e => onMove(e.clientX, e.clientY, e.pointerId));
el.addEventListener('pointerup', e => onUp(e.clientX, e.clientY, e.pointerId));
el.addEventListener('pointercancel', e => onUp(e.clientX, e.clientY, e.pointerId));
el.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = Math.max(6, Math.min(120, cam.dist * (1 + e.deltaY * 0.0011)));
}, { passive: false });

const ray = new THREE.Raycaster();
function onTap(x, y){
  const px = (x / window.innerWidth) * 2 - 1;
  const py = -(y / window.innerHeight) * 2 + 1;
  ray.setFromCamera(new THREE.Vector2(px, py), camera);
  const hit = ray.intersectObject(gems);
  if (hit.length){
    const id = hit[0].instanceId;
    select(id);
  } else {
    deselect();
  }
}

/* ============================================================ ui logic */
const legendName = document.getElementById('legendName');
const legendSub = document.getElementById('legendSub');
const gradEl = document.getElementById('grad');
const catEl = document.getElementById('cat');
const cardEl = document.getElementById('card');
const symEl = document.getElementById('sym');
const nameEl = document.getElementById('name');
const znEl = document.getElementById('zn');
const catlineEl = document.getElementById('catline');
const eraTxtEl = document.getElementById('eraTxt');
const gridEl = document.getElementById('grid');
const cfgEl = document.getElementById('cfg');
const busyEl = document.getElementById('busy');
const dropBusy = () => busyEl.classList.add('done');
['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(ev =>
  window.addEventListener(ev, dropBusy, { once: true, passive: true }));

let metricIdx = 0;
let selected = null;
function select(k){
  selected = k;
  const e = ELEMENTS[k];
  symEl.textContent = e.s;
  symEl.style.color = 'rgb(' + colorAt(METRIC, e).map(x => Math.round(x * 255)).join(',') + ')';
  nameEl.textContent = e.n;
  znEl.textContent = 'atomic number ' + e.z;
  catlineEl.textContent = e.cat + ' · ' + e.blk + '-block · period ' + e.per + (e.grp != null ? ' · group ' + e.grp : '');
  const yr = e.year;
  eraTxtEl.textContent = 'discovered ' + (yr == null ? '\u2014' : (yr < 0 ? (-yr) + ' BCE' : yr)) + ' · ' + ERA_NAMES[e.era] || '';
  gridEl.innerHTML = '';
  const rows = [
    ['mass', e.m != null ? e.m.toFixed(3) + ' u' : '\u2014'],
    ['density', e.d != null ? e.d.toFixed(2) + ' g/cm\u00b3' : '\u2014'],
    ['electroneg.', e.en != null ? e.en.toFixed(2) : '\u2014'],
    ['ionization', e.ion != null ? e.ion.toFixed(2) + ' eV' : '\u2014'],
    ['melt', e.melt != null ? e.melt.toFixed(0) + ' K' : '\u2014'],
    ['boil', e.boil != null ? e.boil.toFixed(0) + ' K' : '\u2014'],
    ['crust (log ppm)', e.crust != null ? e.crust.toFixed(2) : '\u2014'],
    ['cosmic (log)', e.cosmic != null ? e.cosmic.toFixed(2) : '\u2014'],
  ];
  rows.forEach(r => {
    const d = document.createElement('div'); d.className = 'kv';
    d.innerHTML = '<span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span>';
    gridEl.appendChild(d);
  });
  cfgEl.textContent = 'electron configuration · ' + (e.cfg || '\u2014');
  cardEl.classList.add('open');
  const t = k / (N - 1);
  const p = basePosT(t);
  selRing.position.copy(p);
  selRing.lookAt(selRing.position.clone().add(new THREE.Vector3(p.x, p.y, p.z + 1)));
  selRing.visible = true;
}
function deselect(){
  selected = null; cardEl.classList.remove('open'); selRing.visible = false;
}
document.getElementById('close').addEventListener('click', deselect);

document.getElementById('bMetric').addEventListener('click', () => {
  metricIdx = (metricIdx + 1) % METRICS.length;
  applyMetric(metricIdx);
  if (selected != null) select(selected);
});
document.getElementById('bSpin').addEventListener('click', () => {
  spinEnabled = !spinEnabled;
  document.getElementById('bSpin').classList.toggle('on', spinEnabled);
});
document.getElementById('bReset').addEventListener('click', () => {
  cam.az = -0.65; cam.el = 1.12; cam.dist = 42;
  cam.target.set(0, 0, 3);
  deselect();
});
document.getElementById('bFull').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});

applyMetric(0);

/* ============================================================ resize */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  gradePass.material.uniforms.uAspect.value = w / h;
  busyEl.classList.add('done');
});

/* ============================================================ frame */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
const dirV = new THREE.Vector3();
const sclV = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();
const upZ = new THREE.Vector3(0, 0, 1);
const ringPt = new THREE.Vector3();

function tickNodes(time){
  for (let k = 0; k < N; k++){
    const t = k / (N - 1);
    const fire = 0.35 * (0.5 + 0.5 * Math.cos(time * 5.1 + (k % 7) / 6 * 40.0));
    const pulse = 1.0 + standWave(t, time) * 0.30 + ringPulse(t, time) * (0.7 + 0.5 * fire);
    const p = basePosT(t);
    const orb = 0.28 * Math.sin(t * GOLD * 2.0 + time * 0.7) * pulse,
          orb2 = 0.28 * Math.sin(t * GOLD * PHI - time * 0.57) * pulse,
          orb3 = 0.22 * Math.sin(t * GOLD * PHI + time * 0.83) * pulse;
    tmpV.set(p.x + orb, p.y + orb2, p.z + orb3);
    dirV.copy(tmpV).normalize();
    tmpQ.setFromUnitVectors(upZ, dirV);
    sclV.set(pulse, pulse, pulse);
    nodes[0].dummyM.compose(tmpV, tmpQ, sclV);
    gems.setMatrixAt(k, nodes[0].dummyM);
  }
  gems.instanceMatrix.needsUpdate = true;
  if (selected != null){
    gems.getMatrixAt(selected, scratchM);
    ringPt.set(scratchM.elements[12], scratchM.elements[13], scratchM.elements[14]);
    selRing.position.copy(ringPt);
  }
  if (halo){
    const posA = halo.geo.attributes.position.array;
    for (let k = 0; k < N; k++){
      gems.getMatrixAt(k, scratchM);
      const mArr = scratchM.elements;
      posA[k*3] = mArr[12]; posA[k*3+1] = mArr[13]; posA[k*3+2] = mArr[14];
    }
    halo.geo.attributes.position.needsUpdate = true;
  }
}

let _lastF = performance.now(), _slow = 0;
function qualityThrottle(){
  const now = performance.now();
  const dt = now - _lastF; _lastF = now;
  const pr = renderer.getPixelRatio();
  if (dt > 62 && pr > 1){
    _slow++;
    if (_slow >= 30){
      const np = Math.max(1, pr - 0.35);
      renderer.setPixelRatio(np);
      composer.setPixelRatio(np);
      composer.setSize(window.innerWidth, window.innerHeight);
      _slow = 0;
    }
  } else if (dt < 26 || pr <= 1){
    _slow = 0;
  }
}
function loop(){
  const t = clock.getElapsedTime();
  const time = t;

  qualityThrottle();

  dome.mat.uniforms.uTime.value = time;
  stars.mat.uniforms.uTime.value = time;
  sheetMat.uniforms.uTime.value = time;
  creaseMat.uniforms.uTime.value = time;
  gems.material.uniforms.uTime.value = time;
  gradePass.material.uniforms.uTime.value = time;

  tickNodes(time);

  if (spinEnabled && !interact) cam.az += 0.00055;
  if (!interact){
    cam.az += vel.az;
    cam.el += vel.el;
    const damp = Math.pow(0.02, 1 / 60);
    vel.az *= damp;
    vel.el *= damp;
  }

  core.rotation.x = time * 0.3; core.rotation.y = time * 0.23;
  coreHalo.rotation.x = time * 0.6;
  coreHalo.rotation.y = time * 0.42;
  coreHalo.scale.setScalar(1 + 0.05 * Math.sin(time * 1.3));

  rings.rotation.y = time * 0.02;

  updateCamera();
  dome.mesh.position.copy(camera.position);
  composer.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

setTimeout(() => busyEl.classList.add('done'), 500);
</script>
